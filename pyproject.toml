# Root tooling configuration shared by all Python packages in the monorepo.
# Each service/package gets its own pyproject.toml for dependencies (Steps 0.3+).

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["apps/web", "node_modules", ".venv"]

[tool.ruff.lint]
select = [
  "E", "F", "W",   # pycodestyle / pyflakes
  "I",             # isort
  "B",             # bugbear
  "UP",            # pyupgrade
  "S",             # bandit-style security checks
  "N",             # naming
  "SIM",           # simplify
  "RUF",           # ruff-specific
  "DTZ",           # timezone-aware datetimes only
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["azinco_api", "azinco_common", "tests"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106"]  # asserts and fake credentials in tests
"**/migrations/versions/**" = ["S608"]  # DDL f-strings use constant schema names only
"infra/ci/**" = ["S603", "S607"]  # CI scripts may call git

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true

[tool.pytest.ini_options]
testpaths = ["infra/ci/tests", "infra/docker/tests"]
addopts = "-q"
