# Weekly dependency update PRs (Step 0.11). Every PR must pass the full CI before merge.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
  - package-ecosystem: pip
    directories: [/packages/py-common, /packages/rule-engine, /services/api, /services/ledger]
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /apps/web
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directories: [/services/api, /services/ledger, /apps/web]
    schedule: {interval: weekly}
