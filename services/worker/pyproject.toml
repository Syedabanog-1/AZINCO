[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "azinco-worker"
version = "0.1.0"
description = "AZINCO worker: Model Gateway and LangGraph agent graphs (no agent writes the posted ledger)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9,<3",
  "langgraph>=1.2,<2",
  "langgraph-checkpoint-postgres>=3.2,<4",
  "psycopg[binary]>=3.2,<4",
  "psycopg-pool>=3.2,<4",
  "pyyaml>=6.0.2,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "hypothesis>=6.120", "mypy>=1.13", "types-PyYAML>=6.0", "ruff>=0.8"]

[tool.hatch.build.targets.wheel]
packages = ["azinco_worker"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "SIM", "RUF", "DTZ"]

[tool.ruff.lint.isort]
known-first-party = ["azinco_worker", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: needs PostgreSQL with migrations applied"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["azinco_worker", "tests"]

[[tool.mypy.overrides]]
module = ["langgraph.*", "langchain_core.*"]
follow_untyped_imports = true
