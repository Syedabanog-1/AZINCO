[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "azinco-api"
version = "0.1.0"
description = "AZINCO public REST API (FastAPI)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "structlog>=24.4",
  "asyncpg>=0.30,<1",
  "redis>=5.2,<9",
  "boto3>=1.35,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27,<1",
  "mypy>=1.13",
  "boto3-stubs[s3]>=1.35",
  "asyncpg-stubs>=0.30",
  "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["azinco_api"]

[tool.ruff]
# Mirrors the repository root config so `ruff` gives the same result inside the container.
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "SIM", "RUF", "DTZ"]

[tool.ruff.lint.isort]
known-first-party = ["azinco_api", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
markers = [
  "integration: needs the real Docker stack (set AZINCO_INTEGRATION=1)",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["azinco_api", "tests"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
