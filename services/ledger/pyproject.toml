[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "azinco-ledger"
version = "0.1.0"
description = "AZINCO Ledger Service - the only writer of journals (internal network only)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.7,<3",
  "asyncpg>=0.30,<1",
  "azinco-common",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "hypothesis>=6.120",
  "httpx>=0.27,<1",
  "mypy>=1.13",
  "asyncpg-stubs>=0.30",
  "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["azinco_ledger"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "SIM", "RUF", "DTZ"]

[tool.ruff.lint.isort]
known-first-party = ["azinco_ledger", "azinco_common", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
markers = ["integration: needs PostgreSQL with migrations applied"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["azinco_ledger", "tests"]

[tool.pydantic-mypy]
init_forbid_extra = true
